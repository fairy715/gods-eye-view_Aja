name: macOS DMG

# Builds "God's Eye View.app" as a DMG for Apple silicon and for Intel Macs,
# installs each from its image, opens it and checks it, then keeps the DMGs
# as run artifacts.
on:
  workflow_dispatch:
  # Every push to a working branch, so the DMG always has the latest app.
  push:
    branches: ['claude/**']

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: ${{ matrix.name }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            runner: macos-15
            arch: arm64
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build the Claude Desktop panel
        run: npm run build:panel

      - name: Build the app and DMG
        id: build
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          packaging/macos/build-app.sh "$RUNNER_TEMP/out"

      - name: Install, open and check the app
        run: packaging/macos/smoke-test.sh "${{ steps.build.outputs.dmg }}"

      - name: Keep the DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GodsEyeView-macOS-${{ matrix.arch }}
          path: ${{ steps.build.outputs.dmg }}
          compression-level: 0
          retention-days: 30

      - name: Keep the browser screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-screenshot-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
          retention-days: 7
